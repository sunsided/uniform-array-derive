[package]
name = "uniform-array-derive-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
syn = "3.0"
quote = "1.0.47"
proc-macro2 = "1.0.107"
darling = "0.24.1"

# Separate workspace, so the root workspace does not pick up this nightly-only crate.
[workspace]

[[bin]]
name = "expand"
path = "fuzz_targets/expand.rs"
test = false
doc = false
bench = false

# Copied from the root workspace lints: `workspace = true` does not reach this separate workspace.
[lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
