# Publishes uniform-array-derive when release-plz pushes its vX.Y.Z tag.
# Runs in the `crates-io` environment, which only allows v*.*.* tags.
# crates.io trusted publishing is bound to this file name and environment: do not rename either.
# Action refs are tags here; pin with scripts/pin-actions.py.
name: Publish

on:
  push:
    tags:
      # SemVer 2.0 releases and pre-releases (v1.2.0, v1.2.0-rc.1).
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  verify:
    name: verify tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --all-features --doc --locked

  crates-io:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ steps.crate.outputs.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Resolve crate and version from the tag
        id: crate
        run: |
          name="uniform-array-derive"
          version="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')"
          if [ "$actual" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $name $actual"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip versions that are already on crates.io
        id: check
        # The first release of a crate is published by hand, and re-runs must be harmless.
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY publish workflow" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          if [ "$status" = 200 ]; then
            echo "::notice::$CRATE $VERSION is already on crates.io; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CRATE: ${{ steps.crate.outputs.name }}
          VERSION: ${{ steps.crate.outputs.version }}
      - if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: cargo publish -p "$CRATE" --locked
        env:
          CRATE: ${{ steps.crate.outputs.name }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
